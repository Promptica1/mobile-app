<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf8f6">
<title>MIRRO</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px;
    background: #faf8f6; color: #2c2c2a; font-family: Inter, -apple-system, "Segoe UI", Arial, sans-serif; text-align: center; }
  .logo { font-family: "Cormorant Garamond", Georgia, serif; font-size: 40px; font-weight: 600; letter-spacing: .25em; margin: 0 0 24px; }
  h1 { font-family: "Cormorant Garamond", Georgia, serif; font-size: 30px; font-weight: 500; margin: 0 0 8px; }
  p { margin: 0 0 28px; max-width: 280px; font-size: 15px; line-height: 1.6; color: #8a8a85; }
  button { height: 52px; padding: 0 32px; border: 0; border-radius: 999px; background: #d9f26b; color: #2c2c2a; font-size: 15px; font-weight: 500; font-family: inherit; }
</style>
</head>
<body>
  <p class="logo">MIRRO</p>
  <h1 data-ru="Нет подключения" data-en="You're offline">You're offline</h1>
  <p data-ru="Проверьте интернет — как только он появится, приложение снова заработает." data-en="Check your connection — MIRRO will work again as soon as you're back online.">Check your connection — MIRRO will work again as soon as you're back online.</p>
  <button type="button" data-ru="Повторить" data-en="Try again" onclick="location.reload()">Try again</button>
  <script>
    // Русская версия выключена (RU_ENABLED в lib/features.ts): только английский. Чтобы вернуть язык устройства,
    // поставьте true (файл статический и флаг из кода не читает).
    var RU_ENABLED = false;
    var lang = RU_ENABLED && (navigator.language || "en").toLowerCase().indexOf("ru") === 0 ? "ru" : "en";
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-" + lang + "]").forEach(function (el) { el.textContent = el.getAttribute("data-" + lang); });
  </script>
</body>
</html>
