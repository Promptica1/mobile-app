<!-- Subject: Reset your password — MIRRO -->
<!-- MIRRO — reset password email. Supabase → Authentication → Emails → Reset password:
     put the subject above into Subject and the HTML below into Message body. English only. -->

<div style="font-family:Inter,Arial,sans-serif;max-width:480px;margin:0 auto;padding:32px 24px;color:#2c2c2a">
  <p style="font-size:22px;letter-spacing:.25em;font-weight:600;margin:0 0 24px">MIRRO</p>
  <h1 style="font-size:24px;margin:0 0 12px">Reset your password</h1>
  <p style="font-size:15px;line-height:1.6;margin:0 0 24px">We received a request to reset your password. Tap the button to choose a new one.</p>
  <p style="margin:0 0 24px"><a href="{{ .SiteURL }}/reset-password?token_hash={{ .TokenHash }}&type=recovery" style="display:inline-block;background:#d9f26b;color:#2c2c2a;text-decoration:none;font-weight:500;padding:14px 28px;border-radius:999px">Choose a new password</a></p>
  <p style="font-size:12px;color:#8a8a85;line-height:1.6">If you didn't ask for this, ignore this email — your password won't change.</p>
</div>
